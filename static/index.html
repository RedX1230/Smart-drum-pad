<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Smart Drum Pad Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/static/style.css" />
    <style>
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            width: 100%;
            max-width: 1000px;
        }
        .stat-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            margin-bottom: 1rem;
        }
        .stat-value {
            font-size: 2rem;
            font-weight: 600;
            color: var(--primary);
        }
    </style>
</head>
<body>
    <h1>Smart Drum Pad Dashboard</h1>
    
    <div class="card" style="max-width: 1000px;">
        <div class="stat-box">
            <h2>Total Strikes</h2>
            <div class="stat-value" id="totalStrikes">0</div>
        </div>
        <div class="grid">
            <div>
                <h3>Speed & Acceleration</h3>
                <canvas id="metricsChart"></canvas>
            </div>
            <div>
                <h3>Zone Hits</h3>
                <canvas id="zonesChart"></canvas>
            </div>
        </div>
    </div>

    <div class="card" style="max-width: 1000px;">
        <h2>Pattern Evaluation</h2>
        <p style="margin-bottom: 1rem; color: var(--text-muted);">Enter a sequence like LRLR or LLRR to practice your rudiments.</p>
        <div style="display: flex; align-items: center;">
            <input type="text" id="patternInput" placeholder="Enter pattern, e.g. lrlrlr" />
            <button onclick="setPattern()">Set Pattern</button>
        </div>
        <div id="score" style="font-size: 1.5rem; margin-top: 1rem;">Score: 0.00</div>
    </div>

    <script>
        // Main metrics chart (Speed & Accel)
        const ctxMetrics = document.getElementById('metricsChart').getContext('2d');
        const metricsChart = new Chart(ctxMetrics, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    { label: 'Speed', data: [], borderColor: '#4fd1c5', fill: false, tension: 0.3 },
                    { label: 'Accel', data: [], borderColor: '#f56565', fill: false, tension: 0.3 }
                ]
            },
            options: { responsive: true, scales: { y: { beginAtZero: true } } }
        });

        // Zone hits bar chart
        const ctxZones = document.getElementById('zonesChart').getContext('2d');
        const zonesChart = new Chart(ctxZones, {
            type: 'bar',
            data: {
                labels: ['Center', 'Rim', 'Edge', 'Unknown'],
                datasets: [{
                    label: 'Hits',
                    data: [0, 0, 0, 0],
                    backgroundColor: ['#4fd1c5', '#f6e05e', '#fc8181', '#a0aec0']
                }]
            },
            options: { responsive: true, scales: { y: { beginAtZero: true } } }
        });

        async function fetchMetrics() {
            try {
                const res = await fetch('/metrics');
                const data = await res.json();
                
                const speed = data.speed || 0;
                const accel = data.acceleration || 0;
                const strikes = data.total_strikes || 0;
                const zones = data.zone_hits || {};

                document.getElementById('totalStrikes').innerText = strikes;

                const now = new Date().toLocaleTimeString();
                metricsChart.data.labels.push(now);
                metricsChart.data.datasets[0].data.push(speed);
                metricsChart.data.datasets[1].data.push(accel);
                
                if (metricsChart.data.labels.length > 30) { 
                    metricsChart.data.labels.shift(); 
                    metricsChart.data.datasets[0].data.shift(); 
                    metricsChart.data.datasets[1].data.shift(); 
                }
                metricsChart.update();

                // Update zones chart
                zonesChart.data.datasets[0].data = [
                    zones['Center'] || 0,
                    zones['Rim'] || 0,
                    zones['Edge'] || 0,
                    zones['Unknown'] || 0
                ];
                zonesChart.update();

            } catch (err) {
                console.error("Failed to fetch metrics", err);
            }
        }

        async function setPattern() {
            const pat = document.getElementById('patternInput').value;
            await fetch('/set_pattern', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pattern: pat })
            });
        }

        async function fetchScore() {
            try {
                const res = await fetch('/score');
                const data = await res.json();
                document.getElementById('score').textContent = 'Score: ' + data.score.toFixed(2);
            } catch (err) {}
        }

        setInterval(() => { fetchMetrics(); fetchScore(); }, 1000);
    </script>
</body>
</html>
