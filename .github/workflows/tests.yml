name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        # Light, headless deps so the full suite (including the zone-geometry
        # test) runs without system GUI libraries.
        run: pip install pytest Flask PyYAML numpy opencv-python-headless
      - name: Run tests
        run: pytest
